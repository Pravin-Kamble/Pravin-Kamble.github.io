<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="p2Emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="12" fill="url(#p2Bg)"/>
  <!-- Top bar -->
  <rect x="30" y="24" width="540" height="32" rx="6" fill="#134e4a" opacity="0.6"/>
  <circle cx="50" cy="40" r="5" fill="#ef4444"/>
  <circle cx="68" cy="40" r="5" fill="#f59e0b"/>
  <circle cx="86" cy="40" r="5" fill="#10b981"/>
  <text x="110" y="44" fill="#a7f3d0" font-family="monospace" font-size="12">api.gateway.v2 / cluster: active</text>
  <!-- Microservice architecture diagram mockup -->
  <rect x="50" y="80" width="140" height="70" rx="8" fill="#115e59" stroke="#14b8a6" stroke-width="2"/>
  <text x="70" y="112" fill="#ccfbf1" font-family="sans-serif" font-weight="bold" font-size="13">Auth Service</text>
  <text x="70" y="132" fill="#5eead4" font-family="monospace" font-size="11">gRPC :50051</text>
  
  <rect x="230" y="80" width="140" height="70" rx="8" fill="#115e59" stroke="#10b981" stroke-width="2"/>
  <text x="245" y="112" fill="#ccfbf1" font-family="sans-serif" font-weight="bold" font-size="13">Event Broker</text>
  <text x="245" y="132" fill="#5eead4" font-family="monospace" font-size="11">Kafka 2.8k msg/s</text>

  <rect x="410" y="80" width="140" height="70" rx="8" fill="#115e59" stroke="#06b6d4" stroke-width="2"/>
  <text x="430" y="112" fill="#ccfbf1" font-family="sans-serif" font-weight="bold" font-size="13">Data Engine</text>
  <text x="430" y="132" fill="#5eead4" font-family="monospace" font-size="11">PostgreSQL/Redis</text>

  <!-- Connectors -->
  <line x1="190" y1="115" x2="230" y2="115" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="370" y1="115" x2="410" y2="115" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Lower Terminal Panel -->
  <rect x="50" y="180" width="500" height="150" rx="8" fill="#042f2e" stroke="#134e4a" stroke-width="1.5"/>
  <text x="70" y="210" fill="#34d399" font-family="monospace" font-size="13">$ docker compose up --scale worker=8 -d</text>
  <text x="70" y="234" fill="#99f6e4" font-family="monospace" font-size="12">[+] Running 9/9 Containers Started</text>
  <text x="70" y="258" fill="#6ee7b7" font-family="monospace" font-size="12">[INFO] API Gateway latency: p99 &lt; 14ms across 1.2M requests</text>
  <text x="70" y="282" fill="#a7f3d0" font-family="monospace" font-size="12">[READY] Healthcheck 200 OK — zero downtime deployment passed</text>
</svg>
